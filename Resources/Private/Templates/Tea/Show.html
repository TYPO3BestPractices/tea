<!DOCTYPE html>
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:layout name="Default"/>

    <f:section name="main">
        <h2>
            {tea.title}
        </h2>

        <f:if condition="{tea.image}">
            <figure>
                <f:image
                    image="{tea.image}"
                    alt="{tea.image.alternative}"
                    maxWidth="600"
                />
            </figure>
        </f:if>

        {tea.description -> f:format.html()}
    </f:section>
</html>
