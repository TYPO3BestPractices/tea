---
# This GitHub Actions workflow calculates the code coverage of the extension and uploads it to coveralls.io.
#
# Like in the CI workflow, every "runTests.sh" call passes "-b docker". The script prefers podman
# whenever it is present, which is the right default for local runs, but GitHub hosted runners ship
# both and the database containers are not reachable under podman there (#2103).
name: Code coverage
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  code-coverage:
    name: Calculate code coverage
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Show the Composer version
        run: ./Build/Scripts/runTests.sh -b docker -s composer -- --version
      - name: Show the Composer configuration
        run: ./Build/Scripts/runTests.sh -b docker -s composer config --global --list
      - name: Cache dependencies installed with composer
        uses: actions/cache@v6
        with:
          key: "php-${{ matrix.php-version }}-typo3-${{ matrix.typo3-version }}-${{ matrix.composer-dependencies }}-composer-${{ hashFiles('**/composer.json') }}"
          path: .cache/composer
          restore-keys: "php-${{ matrix.php-version }}-typo3-${{ matrix.typo3-version }}-${{ matrix.composer-dependencies }}-composer-\n"
      - name: Install composer dependencies
        run: |
          ./Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdate${{ matrix.composer-dependencies }}
      - name: Run unit tests with coverage
        run: |
          ./Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s unit -m
      - name: Run functional tests with coverage
        run: |
          ./Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -d ${{ matrix.dbms }} -s functional -m
      - name: Show the collected coverage reports
        run: "ls -lahR .Build/coverage/"
      - name: Merge the coverage reports
        run: |
          ./Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s coverageMerge
      - name: Show the merged coverage report
        run: "ls -lahR .Build/logs/"
      - name: Upload coverage results to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: .Build/logs/clover.xml
          format: clover
          fail-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reports of one run are merged into a single result, so they all have to come from
          # the same installed dependency set. Collect the coverage for one TYPO3 and one PHP
          # version only, rather than across the test matrix of the CI workflow.
          - typo3-version: "13.4"
            php-version: "8.2"
            dbms: "sqlite"
            composer-dependencies: Max
